services:
  - type: web
    name: aggroso-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENABLE_FAULT_INJECTION
        value: "false"
      - key: APP_DB_URL
        value: "sqlite:///./app.db"
      - key: TARGET_DB_URL
        value: "sqlite:///./target.db"
      - key: CORS_ORIGINS
        value: "https://aggroso.vercel.app,http://localhost:5173"
      - key: ANTHROPIC_API_KEY
        sync: false
